[project]
name = "ehr-media-intelligence"
version = "0.1.0"
description = "Ingest messy EHR media records, normalize them to FHIR R4, summarize them with an LLM and search them semantically."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "John Merga" }]
dependencies = [
    "chromadb>=1.0",
    "fastapi>=0.115",
    "fhir.resources>=8.0",
    "fhirclient>=4.2",
    "openai>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
ehr = "ehr_platform.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ehr_platform"]

# CPU-only PyTorch keeps the image small; the embedding model does not need a GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: loads the real embedding model (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["fhirclient.*", "chromadb.*", "sentence_transformers.*"]
ignore_missing_imports = true
follow_untyped_imports = false
