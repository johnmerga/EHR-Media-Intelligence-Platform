services:
  api:
    build: .
    restart: unless-stopped
    environment:
      # nginx serves the API under /api; this keeps the interactive docs working there.
      EHR_API_ROOT_PATH: /api
    # Not published: the web container is the only public entry point.
    expose:
      - "8000"

  # Re-runs the pipeline against ./data. Not started by `docker compose up`:
  #   docker compose run --rm pipeline
  pipeline:
    build: .
    profiles: ["pipeline"]
    command: ["ehr", "run"]
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
